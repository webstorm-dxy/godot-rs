[package]
name = "godot-script-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Derive macros for godot-script (attachable Rust scripts for Godot)"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
